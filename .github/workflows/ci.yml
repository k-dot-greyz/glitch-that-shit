name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (chrome + firefox, validates manifests)
        run: npm run build
      - name: Reproducible build check
        run: |
          cp dist/*.sha256 /tmp/
          npm run build
          for f in /tmp/*.sha256; do diff "$f" "dist/$(basename "$f")"; done
          (cd dist && sha256sum -c ./*.sha256)
      - name: Firefox lint (web-ext, pinned)
        run: npx --yes web-ext@10.7.0 lint --source-dir dist/firefox --warnings-as-errors
      - name: Headless Chrome smoke test
        run: npm run smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glitch-that-shit-extension
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
